name: CI

on:
  push:
    branches: [master, v1]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:e2e

  # The lockfile and build job test the minimum supported Pi (1.1.0).
  # Host-provided packages use "*" peers as required by Pi's extension loader.
  # A separate floor job would duplicate build until the development pin moves.
  # Newer Pi versions are a canary, not an implicit compatibility guarantee.
  compat-latest-pi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install latest Pi canary
        run: npm install --no-save @earendil-works/pi-ai@latest @earendil-works/pi-coding-agent@latest @earendil-works/pi-tui@latest
      - run: npm run check
      - run: npm run build
